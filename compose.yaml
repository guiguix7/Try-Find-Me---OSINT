services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: try-find-me-backend

    networks:
      - app-network

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/app:/app/app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  frontend:
    image: node:22-alpine
    container_name: try-find-me-frontend

    working_dir: /app

    networks:
      - app-network

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  app-network:
    name: try-find-me-network
    driver: bridge