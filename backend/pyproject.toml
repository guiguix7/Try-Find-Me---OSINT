[project]
name = "try-find-me-backend"
version = "0.2.0"
description = "Try Find Me! — OSINT backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.35.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "dnspython==2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
